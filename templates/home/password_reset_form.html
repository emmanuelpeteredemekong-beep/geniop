{% extends 'base.html' %}
{% block content %}
<div style="max-width:400px;margin:50px auto;padding:20px;">
<h2>Forgot Password?</h2>
<p>Enter your email to receive reset link</p>
<form method="post">{% csrf_token %}
<input type="email" name="email" placeholder="Your email" required style="width:100%;padding:10px;">
<button type="submit" style="width:100%;padding:10px;margin-top:10px;background:#000;color:#fff;">Send Reset Link</button>
</form>
</div>
{% endblock %}
